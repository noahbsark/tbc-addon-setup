name: Test rating addon

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-rating-addon.yml"
      - "nightslayer-rating/source/**"
      - "nightslayer-rating/tests/**"
      - "central-rating-data/**"

permissions:
  contents: read

jobs:
  windows-integration:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test Windows PowerShell 5.1 updater behavior
        shell: powershell
        run: ./nightslayer-rating/tests/test_updater.ps1

  addon-and-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Test tooltip hooks and rating boundaries
        run: lua5.1 nightslayer-rating/tests/test_addon.lua
      - name: Test shared season data
        run: python -m unittest central-rating-data/test_build_shared_cache.py
