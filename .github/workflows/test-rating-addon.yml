name: Test rating addon

on:
  workflow_call:
    inputs:
      skip_release_validation:
        type: boolean
        default: false
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-rating-addon.yml"
      - ".github/workflows/prepare-rating-release.yml"
      - "nightslayer-rating/source/**"
      - "nightslayer-rating/tests/**"
      - "central-rating-data/**"
      - "tools/*rating*.py"
  pull_request:
    paths:
      - ".github/workflows/test-rating-addon.yml"
      - ".github/workflows/prepare-rating-release.yml"
      - "nightslayer-rating/**"
      - "central-rating-data/**"
      - "tools/*rating*.py"

permissions:
  contents: read

jobs:
  lua-and-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test snapshot publisher
        run: python -m unittest central-rating-data/test_build_shared_cache.py
      - name: Test release packaging
        run: python -m unittest discover -s tools -p 'test_rating_*.py'
      - name: Verify packaged source, bootstrap and checksums
        if: ${{ !inputs.skip_release_validation }}
        run: python tools/package_rating_addon.py --verify
      - name: Test Lua 5.1 rating colors and addon entry points
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          lua5.1 nightslayer-rating/tests/test_rating_colors.lua
          lua5.1 nightslayer-rating/tests/test_usability.lua
          lua5.1 nightslayer-rating/tests/test_player_search.lua
  windows-integration:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Parse and validate Windows updater
        shell: powershell
        run: |
          $updater = 'nightslayer-rating\source\Updater\NightslayerRatingUpdater.ps1'
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $updater),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            throw 'Updater PowerShell syntax validation failed.'
          }

          $source = Get-Content $updater -Raw
          foreach ($required in @(
            '$ProfileLimitPerRun = 50',
            '[IO.FileShare]::ReadWrite',
            'existingPriority',
            'profileLookup = true'
          )) {
            if (-not $source.Contains($required)) {
              throw "Updater is missing required behavior: $required"
            }
          }

      - name: Test updater cutoff and season behavior
        shell: powershell
        run: |
          ./nightslayer-rating/tests/test_updater.ps1
          ./nightslayer-rating/tests/test_profile_refresh.ps1
          ./nightslayer-rating/tests/test_process_queue.ps1
          ./nightslayer-rating/tests/test_rating_history.ps1
          ./nightslayer-rating/tests/test_upgrade.ps1
