name: Refresh rating snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-rating-data.yml"
      - "central-rating-data/**"
      - "nightslayer-rating/source/Updater/Season2Cutoffs.json"
permissions:
  contents: write

concurrency:
  group: rating-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test snapshot publisher
        run: python -m unittest central-rating-data/test_build_shared_cache.py

      - name: Build shared snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ratings-data --repo "$GITHUB_REPOSITORY" \
            --pattern shared-cache.json.gz --dir "$RUNNER_TEMP/nsr-previous"
          python central-rating-data/build_shared_cache.py \
            --previous-snapshot "$RUNNER_TEMP/nsr-previous/shared-cache.json.gz" \
            --profile-limit 100 --profile-seconds 480 \
            --output shared-cache.json.gz \
            --meta-output shared-cache.meta.json \
            --lua-output shared-data.lua.gz

      - name: Publish stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ratings-data --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ratings-data \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Nightslayer Rating data" \
              --notes "Automatically refreshed public arena-rating snapshot for Nightslayer and Dreamscythe."
          fi
          gh release upload ratings-data \
            shared-cache.json.gz shared-cache.meta.json shared-data.lua.gz \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
